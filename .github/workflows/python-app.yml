# Runs the tests on every supported Python version, against Swish's MSS test
# environment. The MSS test certificates are public and downloaded by the
# tests' Makefile, so this needs no secrets and works for pull requests from
# forks too.

name: Tests

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  test:

    # Pinned: GitHub's builds of Python 3.8 and 3.9 stop at Ubuntu 24.04.
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]

    steps:
    - uses: actions/checkout@v7
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        pip install -r requirements.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
    - name: Download the MSS test certificates
      run: make -C tests certs
    - name: Test with pytest
      run: pytest
